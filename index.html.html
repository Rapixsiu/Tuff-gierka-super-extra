<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Stand: Zombie Siege</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c0d0b; --soot:#161813; --panel:#1d1f19; --panel2:#262920; --line:#3a3d30;
  --bone:#e6dfc6; --dim:#9b977f; --blood:#c8352b; --blood2:#7d1d18; --toxic:#8fc15a; --gold:#e3b24a; --ice:#6fc3e8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#0c0d0b; --soot:#161813; --bone:#e6dfc6; } }
:root[data-theme="dark"]{ --ink:#0c0d0b; --soot:#161813; --bone:#e6dfc6; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:17px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#root{min-height:100%}
.disp{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;letter-spacing:.04em;font-weight:400}
.btn{background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:3px;font-weight:700;letter-spacing:.03em;transition:background .12s,border-color .12s,transform .08s}
.btn:hover:not(:disabled){background:#33362a;border-color:#5a5e49}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.card:focus-visible,.shopi:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:var(--blood);border-color:#e0594f;color:#fff}
.btn.primary:hover:not(:disabled){background:#dd4439}
.btn.big{font-size:1.5rem;padding:14px 22px;text-align:left;width:100%}
.btn.sm{padding:5px 10px;font-size:.95rem}
.lobby{min-height:100vh;position:relative;display:flex;flex-direction:column;overflow-x:hidden;
  background:radial-gradient(ellipse at 70% 10%,rgba(200,53,43,.22),transparent 55%),radial-gradient(ellipse at 10% 100%,rgba(143,193,90,.07),transparent 50%),linear-gradient(#10110e,#0a0b09)}
.lobby .top{display:flex;justify-content:flex-end;padding:12px 16px;gap:8px}
.lobby .main{flex:1;display:grid;grid-template-columns:minmax(300px,1.1fr) minmax(260px,.9fr);gap:28px;padding:10px 6vw 30px;align-items:center}
.title{font-size:clamp(3.6rem,10vw,8rem);line-height:.86;margin:0;color:var(--bone);text-shadow:0 0 30px rgba(200,53,43,.35),3px 3px 0 var(--blood2)}
.subtitle{font-size:clamp(1.6rem,4.6vw,3rem);color:var(--blood);margin:6px 0 20px;text-shadow:2px 2px 0 #2a0907}
.menu{display:grid;gap:10px;max-width:420px}
.stats{background:rgba(22,24,19,.8);border:1px solid var(--line);padding:18px;border-radius:4px;display:grid;gap:12px}
.stats h3{margin:0;font-size:1.8rem;color:var(--gold)}
.statrow{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:6px;color:var(--dim)}
.statrow b{color:var(--bone);font-weight:700}
.silh{display:flex;justify-content:center;gap:6px;opacity:.9;padding:0 10px 10px;flex-wrap:nowrap;overflow:hidden}
.silh canvas{filter:brightness(.22) saturate(0);flex:none}
.back{position:fixed;inset:0;background:rgba(5,5,4,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.modal{background:var(--soot);border:1px solid var(--line);border-radius:4px;width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 80px #000}
.modal.narrow{width:min(560px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:2.1rem;color:var(--bone)}
.mb{padding:16px 18px;overflow:auto;flex:1}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{background:none;border:1px solid var(--line);padding:6px 14px;border-radius:3px;font-weight:700}
.tab.on{background:var(--blood);border-color:#e0594f;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;position:relative}
.card:hover{border-color:#6a6e57}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.card .nm{font-weight:700;font-size:.98rem;line-height:1.05}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(250px,1fr);gap:16px}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px;align-self:start;position:sticky;top:0}
.detail h3{margin:0 0 4px;font-size:2rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:10px 0}
.kv span:nth-child(odd){color:var(--dim)}
.lore{color:var(--dim);font-style:italic;line-height:1.3;margin-top:8px}
.rar{font-size:.85rem;font-weight:700}
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--dim);font-weight:600}
.scroll-x{overflow-x:auto}
.hint{color:var(--dim);margin:0 0 12px}
.strip-wrap{position:relative;overflow:hidden;border:1px solid var(--line);background:#101109;height:136px;margin:10px 0}
.strip{display:flex;position:absolute;left:0;top:0;height:100%}
.strip-item{flex:none;width:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-right:1px solid #22241b;font-weight:700;font-size:.9rem}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--gold);box-shadow:0 0 14px var(--gold);z-index:2;transform:translateX(-50%)}
.chestbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
.lid{transform-origin:20px 50px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.open .lid{transform:rotate(-38deg)}
.glow{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.5)}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.game{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:44px 8px 10px;gap:6px;background:#0a0b09}
.hud{width:min(1100px,100%);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:3px}
.hud .grp{display:flex;align-items:center;gap:6px;font-weight:700;font-size:1.1rem}
.hud .lab{color:var(--dim);font-weight:600}
.hpbar{width:150px;height:14px;background:#2a0f0d;border:1px solid #6a2a25;position:relative;border-radius:2px;overflow:hidden}
.hpfill{height:100%;background:linear-gradient(#ee5a4a,#a02720);transition:width .15s}
.hptxt{position:absolute;inset:0;text-align:center;font-size:.8rem;line-height:13px;font-weight:700;text-shadow:0 1px 2px #000}
.stage{position:relative;width:min(1100px,100%,calc((100vh - 275px)*1.6));min-width:300px;aspect-ratio:960/600;border:1px solid var(--line);background:#000;border-radius:3px;overflow:hidden}
.stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.notif{position:absolute;top:10px;right:10px;background:linear-gradient(#a8271f,#6d140f);border:1px solid #f0786e;padding:8px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;border-radius:3px;box-shadow:0 0 22px rgba(200,53,43,.6);animation:slidein .4s cubic-bezier(.2,1.2,.4,1);text-align:left;color:#fff}
.notif b{font-size:1.4rem;display:block;line-height:1}
@keyframes slidein{from{transform:translateX(120%)}}
.overlay{position:absolute;inset:0;background:rgba(5,5,4,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.overlay h2{font-size:clamp(2.6rem,8vw,5rem);margin:0;line-height:.9}
.dock{width:min(1100px,100%);display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.shop{flex:1 1 380px;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;background:var(--panel);border:1px solid var(--line);padding:6px;border-radius:3px;min-height:92px}
.shopi{flex:none;width:84px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:.85rem;line-height:1.05;text-align:center}
.shopi.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.shopi.no{opacity:.45}
.shopi .c{color:var(--gold)}
.tpanel{flex:1 1 280px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;min-height:92px}
.tpanel .row{display:flex;gap:6px;flex-wrap:wrap}
.mini{height:6px;background:#333;border-radius:2px;overflow:hidden}
.mini>div{height:100%;background:var(--toxic)}
.wavebtn{flex:0 0 auto;min-width:150px}
.small{font-size:.92rem;color:var(--dim)}
.cr-wrap{display:grid;gap:10px}
.cr-hero{text-align:center;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.cr-hero .disp{font-size:2.3rem;color:var(--blood);text-shadow:2px 2px 0 var(--blood2);line-height:1}
.cr-card{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,var(--panel2),var(--panel));border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:3px;padding:10px 14px}
.cr-badge{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;color:#fff;border:2px solid rgba(255,255,255,.25);flex:none}
.cr-name{font-size:1.9rem;letter-spacing:.05em}
.cr-foot{text-align:center;margin-top:6px}
.ul-item{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--blood);border-radius:3px;padding:14px 16px 12px 18px;margin-bottom:12px}
.ul-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.ul-ver{background:var(--blood);color:#fff;border-radius:3px;padding:2px 12px;font-size:1.7rem}
.ul-tag{background:var(--gold);color:#1a1405;font-weight:700;border-radius:3px;padding:1px 8px;font-size:.85rem;letter-spacing:.06em}
.ul-title{color:var(--dim);font-weight:600}
.ul-sec{margin:10px 0 4px;color:var(--gold);font-size:1.4rem}
.ul-sec.ul-hero{color:var(--toxic)}
.ul-list{margin:0;padding-left:20px;line-height:1.35}
.ul-list li{margin:3px 0}
@media (max-width:760px){.lobby .main{grid-template-columns:1fr}.split{grid-template-columns:1fr}.detail{position:static}.hpbar{width:110px}}
@media (prefers-reduced-motion:reduce){.glow,.pop,.notif{animation:none}}
.adminbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;z-index:40;background:var(--blood2);border-color:var(--blood)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
"use strict";
/* ============================ UTIL ============================ */
const GAME_VERSION='1.5';
const {useState,useEffect,useRef,useCallback,useMemo}=React;
const html=htm.bind(React.createElement);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hyp=Math.hypot, PI2=Math.PI*2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============================ DATA ============================ */
const W=960,H=600,PX=55,GRID=40;
const RAR={common:{n:'Common',c:'#b8b8a8',w:50},uncommon:{n:'Uncommon',c:'#6fbf5a',w:28},rare:{n:'Rare',c:'#4aa3e8',w:14},epic:{n:'Epic',c:'#b266e8',w:6.5},mythic:{n:'Mythic',c:'#ff5a3c',w:1.5}};
const TOWERS=[
{id:'gunman',name:'Gunman',cost:100,dmg:12,range:150,rate:1.0,type:'Ranged',rar:'common',col:'#b08a5a',mult:1,desc:'Revolver single shot with recoil and a small puff of smoke.'},
{id:'archer',name:'Archer',cost:120,dmg:10,range:220,rate:.8,type:'Arrow',rar:'common',col:'#4f8a4a',mult:2,desc:'Fast arrows that pierce through up to three zombies.'},
{id:'swordsman',name:'Swordsman',cost:180,dmg:35,range:60,rate:1.1,type:'Melee M1',rar:'common',col:'#4a6fb5',mult:1,desc:'Swift sword arc that cuts every zombie in front of him.'},
{id:'shotgunner',name:'Shotgunner',cost:250,dmg:8,range:120,rate:1.5,type:'Spread (x5 pellets)',rar:'uncommon',col:'#8a5a3a',mult:5,desc:'Wide cone of buckshot that knocks back light zombies.'},
{id:'flame',name:'Flame Thrower',cost:350,dmg:4,range:110,rate:.1,type:'Area Spray',rar:'uncommon',col:'#c4572a',mult:1,desc:'Continuous flame stream. Zombies keep burning after the fire stops.'},
{id:'sniper',name:'Sniper',cost:400,dmg:150,range:400,rate:3.0,type:'Armor Piercing',rar:'uncommon',col:'#4a5a3a',mult:1.25,desc:'Instant red tracer. Targets the toughest zombie, ignores armor and shields, 25% crit.'},
{id:'grenadier',name:'Grenadier',cost:450,dmg:60,range:180,rate:2.2,type:'Explosive Splash',rar:'uncommon',col:'#6a7a3a',mult:1,desc:'Lobbed grenade with a blast radius and a scorched crater.'},
{id:'tesla',name:'Tesla Coil',cost:550,dmg:40,range:160,rate:1.4,type:'Chain Lightning',rar:'rare',col:'#4a8ac4',mult:2.5,desc:'Electric arc that jumps through up to 4 nearby zombies.'},
{id:'axe',name:'Axe Berserker',cost:600,dmg:80,range:70,rate:1.0,type:'Heavy Melee M1',rar:'rare',col:'#a83a32',mult:1,desc:'Double-axe chop that hits everything around him with a shockwave.'},
{id:'frost',name:'Frost Mage',cost:650,dmg:20,range:200,rate:1.2,type:'Slow Beam',rar:'rare',col:'#7ac8e8',mult:1,desc:'Ice shards that slow movement speed by 50%.'},
{id:'mortar',name:'Toxic Mortar',cost:750,dmg:50,range:350,rate:3.5,type:'Poison Cloud',rar:'rare',col:'#5a8a3a',mult:1.6,desc:'Shell leaves a toxic puddle that melts anything walking through.'},
{id:'medic',name:'Medic',cost:700,dmg:0,range:170,rate:4,type:'Support Aura',rar:'rare',col:'#5ec88a',mult:1,desc:'Pulses a protective aura. Towers in range become immune to zombie hits and stuns for 2.2s. Cooldown 4s, reduced by 1s with each upgrade.'},
{id:'plasma',name:'Plasma Cannon',cost:850,dmg:120,range:250,rate:2.0,type:'Energy Orb',rar:'epic',col:'#c24ae0',mult:1.5,desc:'Slow energy sphere that disintegrates every zombie in its path.'},
{id:'minigun',name:'Minigunner',cost:950,dmg:15,range:200,rate:.08,type:'Rapid Fire',rar:'epic',col:'#7a7a7a',mult:1,desc:'Absurd rate of fire with spent casings flying everywhere.'},
{id:'necro',name:'Necromancer',cost:1100,dmg:40,range:220,rate:2.0,type:'Summoner',rar:'epic',col:'#6a3a9a',mult:1,desc:'Homing dark energy. Raises skeletons that block the road and fight.'},
{id:'guardian',name:'Guardian of Atlantis',cost:1000,dmg:75,range:90,rate:.9,type:'Spear / Slow Throw',rar:'epic',col:'#2a9ab8',mult:1,desc:'Wields a spear in close combat. If an enemy slips out of its short range it throws the spear, dealing damage and slightly slowing the target.'},
{id:'deku',name:'Deku',cost:1400,dmg:260,range:105,rate:.55,type:'Hero (MHA) - Smash',rar:'mythic',col:'#2f8f4a',mult:1.2,desc:'My Hero Academia collab. Short-range brawler: fast, powerful punches. Lv2: stun immunity + Delaware Smash. Lv3: Detroit Smash + damaging smoke.'},
{id:'allmight',name:'All Might',cost:2200,dmg:520,range:95,rate:.8,type:'Hero (MHA) - Melee M1',rar:'mythic',col:'#d8a820',mult:1,desc:'My Hero Academia collab. Overpowered M1 punches and immune to stuns. Lv2: ground slam that leaves a crater. Lv3: Detroit Smash, stronger than Deku.'},
{id:'kaiser',name:'Michael Kaiser',cost:1900,dmg:380,range:92,rate:.75,type:'Hero (Blue Lock) - Melee M1',rar:'mythic',col:'#2a3aa8',mult:1,desc:'Blue Lock collab. Fights with his fists. Lv2: charges a Kaiser Impact punch (extra damage, knockback, crater). Lv3: dropkick on an enemy every 20s.'},
{id:'rin',name:'Rin Itoshi',cost:1800,dmg:230,range:300,rate:.7,type:'Hero (Blue Lock) - Curving Shot',rar:'mythic',col:'#1fb8b0',mult:1,desc:'Blue Lock collab. Shoots blue curving soccer balls. Lv3: Awakening "I\'ll Mangle You" (more range and attack speed). Click him to activate, recharges every 60s.'},
{id:'isagi',name:'Isagi',cost:1700,dmg:250,range:100,rate:.6,type:'Hero (Blue Lock) - Melee M1',rar:'mythic',col:'#2a6ae0',mult:1,desc:'Blue Lock collab. Fights with his fists. Lv3: Awakening "Metavision" (faster attacks, more range). Click him to activate, recharges every 60s.'},
{id:'superhuman',name:'Super Human',cost:1500,dmg:300,range:350,rate:.5,type:'Laser & Ultimate M1',rar:'mythic',col:'#2a5ac8',mult:1.2,desc:'Twin red eye lasers pierce the line. When zombies get close it switches to powerful punches. At max level it can be moved.'}
];
const TM={};TOWERS.forEach(t=>TM[t.id]=t);
const ZOMBIES=[
{id:'walker',name:'Walker',hp:40,spd:1.0,bd:5,power:'None',col:'#6b8a52',r:11,minWave:1,lore:'The first to turn. Slow, hungry and endless. Most of the dead are Walkers.'},
{id:'runner',name:'Runner',hp:25,spd:2.2,bd:3,power:'High movement speed',col:'#8a9a4a',r:9,minWave:2,lore:'A fresh turn that still remembers how to sprint. Arrives before you finish reloading.'},
{id:'crawler',name:'Crawler',hp:20,spd:.8,bd:2,power:'Low hitbox: ~35% of shots miss',col:'#5a7a5a',r:8,minWave:3,lore:'Legs gone, hunger intact. It drags itself along under the muzzle flashes.'},
{id:'brute',name:'Brute',hp:180,spd:.6,bd:15,power:'Tanky, high health',col:'#7a6a4a',r:16,minWave:4,lore:'Bloated with something the lab never named. Bullets just sink in.'},
{id:'spitter',name:'Spitter',hp:60,spd:1.1,bd:8,power:'Spits acid that stuns the nearest tower for 3s',col:'#9ac23a',r:11,minWave:5,lore:'Its throat glows green. Anything it hits stops working for a while.'},
{id:'exploder',name:'Exploder',hp:50,spd:1.8,bd:20,power:'Blows up on death, damaging nearby towers',col:'#c47a3a',r:12,minWave:6,lore:'Strapped with scavenged charges. Kill it far from your defenses.'},
{id:'shield',name:'Shield Zombie',hp:150,spd:.7,bd:10,power:'Takes 70% less damage from the front',col:'#6a7a8a',r:13,minWave:7,lore:'Carries a riot shield welded to its arm. Hit it from behind or use armor piercing.'},
{id:'speedster',name:'Speedster',hp:40,spd:2.8,bd:5,power:'Rapid dash bursts',col:'#c4c44a',r:9,minWave:8,lore:'Sprints in bursts, then coils up and sprints again. Hard to track.'},
{id:'healer',name:'Healer Zombie',hp:100,spd:.9,bd:8,power:'Aura heals nearby zombies',col:'#8ae0a0',r:12,minWave:9,lore:'Glows softly. Its touch knits flesh back together. Kill it first.'},
{id:'ghost',name:'Ghost Zombie',hp:80,spd:1.2,bd:10,power:'Turns invisible: towers cannot target it',col:'#a8c8d8',r:11,minWave:10,lore:'Flickers in and out of sight. Area damage still finds it.'},
{id:'armored',name:'Armored Tank',hp:350,spd:.5,bd:25,power:'Heavy armor; immune to slowdowns',col:'#555a5a',r:17,minWave:11,lore:'Welded into scrap plate. Weak hits barely scratch the steel.',noSlow:true},
{id:'necrozombie',name:'Necro Zombie',hp:120,spd:.8,bd:12,power:'Resurrects fallen Walkers',col:'#7a4a9a',r:12,minWave:12,lore:'Chants over the corpses. Dead Walkers rise again at half health.'},
{id:'frostzombie',name:'Frost Zombie',hp:200,spd:.9,bd:12,power:'Aura slows nearby tower fire rate',col:'#8ad0f0',r:13,minWave:13,lore:'Frozen solid and still moving. Your triggers get stiff around it.'},

const PATH=[[-30,100],[160,100],[160,260],[400,260],[400,100],[640,100],[640,380],[240,380],[240,520],[850,520]];
const SEG=[];let TOT=0;

function distPath(x,y){let m=1e9;for(const s of SEG){const px=x-s.a[0],py=y-s.a[1];const u=clamp(px*s.dx+py*s.dy,0,s.l);const d=hyp(px-s.dx*u,py-s.dy*u);if(d<m)m=d}return m}

function buildWave(n){
const avail=ZOMBIES.filter(z=>!z.boss&&!z.noNat&&z.minWave<=n);let budget=45+n*30+Math.pow(n,1.5)*4;if(n===20)budget*=.5;
const cost=z=>z.hp/10+6;const list=[];
avail.filter(z=>z.minWave===n).forEach(z=>{for(let i=0;i<2+Math.floor(n/6);i++){list.push(z.id);budget-=cost(z)}});
let g=0;while(budget>8&&g++<500){const ws=avail.map(z=>({z,w:1+(z.minWave>=n-3?2:0)+(cost(z)<20?1:0)}));let tot=0;ws.forEach(o=>tot+=o.w);let r=Math.random()*tot,ch=ws[0].z;for(const o of ws){r-=o.w;if(r<=0){ch=o.z;break}}
const cnt=1+Math.floor(Math.random()*4);for(let i=0;i<cnt&&budget>8;i++){list.push(ch.id);budget-=cost(ch)}}
const gap=Math.max(.32,1.25-n*.03);const q=[];let t=1;for(const id of list){q.push({t,id});t+=gap*rnd(.7,1.3)}
let bosses=[];
if(n>=15&&n<=19)bosses=BOSSW[n];else if(n===20)bosses=['overlord'];
else if(n>20){const k=n-20;for(let i=0;i<1+Math.floor(k/2);i++)bosses.push('titan');for(let i=0;i<1+Math.floor((k-1)/2);i++)bosses.push('abomination');for(let i=0;i<Math.floor(k/5);i++)bosses.push('overlord')}
bosses.forEach((id,i)=>q.push({t:id==='overlord'?3+i*10:t*(.3+.65*(i+1)/(bosses.length+1)),id}));
if(n===100)q.push({t:12,id:'fallenking'});if(n===120)q.push({t:12,id:'sae'});if(n===50)return shigWave(q,n);
q.sort((a,b)=>a.t-b.t);return q}

c.fillStyle='rgba(200,53,43,.85)';c.font='700 15px "Barlow Condensed",sans-serif';c.textAlign='left';c.fillText('SPAWN',6,78);c.beginPath();c.moveTo(8,86);c.lineTo(34,100);c.lineTo(8,114);c.fill();
// vignette
const g=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');c.fillStyle=g;c.fillRect(0,0,W,H);return cv}

function drawBase(c,G,time){const x=BASEP.x,y=BASEP.y;c.save();c.translate(x,y);const dmg=1-G.hp/100;
c.fillStyle='rgba(0,0,0,.4)';c.fillRect(-26,-34,60,76);
c.fillStyle='#5a5d57';c.fillRect(-30,-38,56,70);c.fillStyle='#3e413c';c.fillRect(-30,-38,56,10);c.fillStyle='#22241f';c.fillRect(-26,-6,14,38);
c.fillStyle='#8a7a4a';for(let i=0;i<4;i++){c.beginPath();c.ellipse(-34,-30+i*18,8,6,0,0,PI2);c.fill()}
c.strokeStyle='rgba(0,0,0,.6)';c.lineWidth=1.5;for(let i=0;i<Math.floor(dmg*10);i++){c.beginPath();c.moveTo(-28+i*5,-36+(i*13%60));c.lineTo(-20+i*4,-20+(i*17%50));c.stroke()}
c.fillStyle='#e6dfc6';c.font='700 14px "Barlow Condensed",sans-serif';c.textAlign='center';c.fillText('BASE',-2,-44);
if(G.baseHit>0){circ(c,-4,0,50+G.baseHit*20,'rgba(255,40,30,'+G.baseHit*.35+')')}
c.restore()}

function drawFx(c,G){for(const f of G.fx){const u=f.life/f.max;switch(f.k){
case 'arc':c.strokeStyle=f.col;c.globalAlpha=u;c.lineWidth=f.w*u+1;c.beginPath();c.arc(f.x,f.y,f.r*(1.15-.15*u),f.a-f.sp,f.a+f.sp);c.stroke();c.lineWidth=f.w*.35*u;c.strokeStyle='#fff';c.stroke();c.globalAlpha=1;break;
case 'ring':{const r=f.r0+(f.r1-f.r0)*(1-u);c.globalAlpha=u;c.strokeStyle=f.col;c.lineWidth=f.w*u+.5;c.beginPath();c.arc(f.x,f.y,r,0,PI2);c.stroke();c.globalAlpha=1;break}
case 'beam':c.save();c.globalAlpha=Math.min(1,u*1.6);c.lineCap='round';if(f.glow){c.shadowColor=f.col;c.shadowBlur=f.glow}c.strokeStyle=f.col;c.lineWidth=f.w*(.4+.6*u);c.beginPath();c.moveTo(f.x1,f.y1);c.lineTo(f.x2,f.y2);c.stroke();c.shadowBlur=0;c.strokeStyle='#fff';c.lineWidth=f.w*.35*u;c.stroke();c.restore();break;
case 'bolt':c.save();c.globalAlpha=Math.min(1,u*2);c.shadowColor=f.col;c.shadowBlur=12;c.strokeStyle=f.col;c.lineWidth=3;c.beginPath();f.pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();c.shadowBlur=0;c.strokeStyle='#fff';c.lineWidth=1.2;c.stroke();c.restore();break;
case 'flash':c.save();c.translate(f.x,f.y);c.rotate(f.a);c.globalAlpha=u;c.fillStyle=f.col;c.beginPath();c.moveTo(0,0);c.lineTo(f.len,-f.len*.28);c.lineTo(f.len*1.3,0);c.lineTo(f.len,f.len*.28);c.fill();c.restore();break;
case 'boom':{const p=1-u;const r=f.r*(.3+.7*p);const g=c.createRadialGradient(f.x,f.y,0,f.x,f.y,r);g.addColorStop(0,'rgba(255,250,200,'+u+')');g.addColorStop(.4,'rgba(255,150,40,'+u*.85+')');g.addColorStop(1,'rgba(160,30,0,0)');c.fillStyle=g;c.beginPath();c.arc(f.x,f.y,r,0,PI2);c.fill();break}
}}}

function draw(c,G,bg){c.save();if(G.shake>0)c.translate(rnd(-1,1)*G.shake,rnd(-1,1)*G.shake);
c.drawImage(bg,0,0,W,H);
for(const d of G.decals){const a=Math.min(1,d.life/3);if(d.k==='blood'){c.fillStyle='rgba(100,12,10,'+.5*a+')';c.beginPath();c.ellipse(d.x,d.y,d.r*1.3,d.r*.9,0,0,PI2);c.fill()}else{c.fillStyle='rgba(10,8,6,'+.55*a+')';c.beginPath();c.arc(d.x,d.y,d.r,0,PI2);c.fill();c.strokeStyle='rgba(80,60,40,'+.5*a+')';c.lineWidth=2;c.stroke()}}
for(const p of G.pud){const a=Math.min(1,p.life/1.5);const g=c.createRadialGradient(p.x,p.y,2,p.x,p.y,p.r);g.addColorStop(0,'rgba(140,240,70,'+.55*a+')');g.addColorStop(1,'rgba(60,140,30,'+.2*a+')');c.fillStyle=g;c.beginPath();c.ellipse(p.x,p.y,p.r,p.r*.8,0,0,PI2);c.fill()}
drawBase(c,G,G.t);
for(const s of G.skels)drawSkel(c,s,G.t);
const zs=G.zs.slice().sort((a,b)=>a.y-b.y);for(const z of zs)drawZombie(c,z,G.t);
for(const t of G.ts.slice().sort((a,b)=>a.y-b.y))drawTower(c,t,G.t);
for(const p of G.projs){if(p.kind==='lob'){c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(p.x,p.y,6,3,0,0,PI2);c.fill();circ(c,p.x,p.y-(p.z||0),p.sub==='mortar'?5:4,p.col,'#111',1);if(p.sub==='acid')circ(c,p.x,p.y-(p.z||0),7,'rgba(160,230,60,.3)');continue}
const a=Math.atan2(p.vy,p.vx);c.save();c.translate(p.x,p.y);c.rotate(a);
if(p.kind==='bullet'){c.fillStyle='#ffe9a8';c.fillRect(-5,-1.2,8,2.4)}
else if(p.kind==='arrow'){c.fillStyle='#d8d0b0';c.fillRect(-12,-.8,16,1.6);c.fillStyle='#bbb';c.beginPath();c.moveTo(4,-3);c.lineTo(9,0);c.lineTo(4,3);c.fill();c.fillStyle='#c44';c.fillRect(-12,-2.4,3,4.8)}
else if(p.kind==='pellet'){circ(c,0,0,2.2,'#ffcf8a')}
else if(p.kind==='shard'){c.fillStyle='#d8f8ff';c.beginPath();c.moveTo(7,0);c.lineTo(0,-3);c.lineTo(-6,0);c.lineTo(0,3);c.fill()}
else if(p.kind==='orb'){const g=c.createRadialGradient(0,0,1,0,0,p.r+8);g.addColorStop(0,'#fff');g.addColorStop(.35,'#e08aff');g.addColorStop(1,'rgba(180,70,230,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,p.r+8,0,PI2);c.fill()}
else if(p.kind==='ball'){const g=c.createRadialGradient(0,0,1,0,0,p.r+9);g.addColorStop(0,'#fff');g.addColorStop(.45,'#5ac8ff');g.addColorStop(1,'rgba(40,140,255,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,p.r+9,0,PI2);c.fill();circ(c,0,0,p.r*.7,'#f4faff','#2a8ad8',1.2)}else if(p.kind==='bolt'){const g=c.createRadialGradient(0,0,1,0,0,p.r+5);g.addColorStop(0,'#eaffea');g.addColorStop(.5,'#6aff8a');g.addColorStop(1,'rgba(60,200,100,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,p.r+5,0,PI2);c.fill()}
c.restore()}
drawFx(c,G);
for(const p of G.pt){const u=p.life/p.max;c.globalAlpha=Math.min(1,u*1.4);if(p.add)c.globalCompositeOperation='lighter';c.fillStyle=p.col;const s=p.size*(.4+.6*u);if(p.sq){c.save();c.translate(p.x,p.y);c.rotate(p.life*20);c.fillRect(-s,-s/2,s*2,s);c.restore()}else{c.beginPath();c.arc(p.x,p.y,s,0,PI2);c.fill()}c.globalCompositeOperation='source-over'}c.globalAlpha=1;
for(const x of G.tx){c.globalAlpha=Math.min(1,x.life/x.max*1.6);c.font='700 '+Math.round(15*x.sz)+'px "Barlow Condensed",sans-serif';c.textAlign='center';c.lineWidth=3;c.strokeStyle='#000';c.strokeText(x.txt,x.x,x.y);c.fillStyle=x.col;c.fillText(x.txt,x.x,x.y)}c.globalAlpha=1;
// selection / placement
const sel=G.sel;if(sel){const S=statsFor(sel.T,sel.lvl,sel.evo);circ(c,sel.x,sel.y,S.range,'rgba(227,178,74,.07)','rgba(227,178,74,.6)',1.5);circ(c,sel.x,sel.y,20,null,'#e3b24a',1.5)}
if(G.moving&&G.mouse.in){const mt=G.moving;const gx=Math.floor(G.mouse.x/GRID)*GRID+20,gy=Math.floor(G.mouse.y/GRID)*GRID+20;const ok=validSpot(G,gx,gy,mt);const S=statsFor(mt.T,mt.lvl,mt.evo);circ(c,gx,gy,S.range,ok?'rgba(143,193,90,.1)':'rgba(200,53,43,.1)',ok?'rgba(143,193,90,.7)':'rgba(200,53,43,.7)',1.5);c.globalAlpha=.6;drawTower(c,{...mt,x:gx,y:gy,hp:1,maxHp:1,imm:0,stun:0},G.t);c.globalAlpha=1}
if(G.place&&G.mouse.in){const T=TM[G.place];const gx=Math.floor(G.mouse.x/GRID)*GRID+20,gy=Math.floor(G.mouse.y/GRID)*GRID+20;const ok=validSpot(G,gx,gy)&&(G.money>=T.cost||G.free);const S=statsFor(T,1,G.evo.has(T.id));circ(c,gx,gy,S.range,ok?'rgba(143,193,90,.1)':'rgba(200,53,43,.1)',ok?'rgba(143,193,90,.7)':'rgba(200,53,43,.7)',1.5);c.globalAlpha=.75;drawTower(c,{x:gx,y:gy,T,id:T.id,lvl:1,evo:G.evo.has(T.id),ang:-.6,recoil:0,swing:0,firing:0,laser:0,hurt:0,spin:0,stun:0,hp:1,maxHp:1},G.t);c.globalAlpha=1}
c.restore();
if(G.baseHit>0){const g=c.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H);g.addColorStop(0,'rgba(200,20,10,0)');g.addColorStop(1,'rgba(200,20,10,'+G.baseHit*.55+')');c.fillStyle=g;c.fillRect(0,0,W,H)}
if(G.sub){const S=G.sub;c.font='700 22px "Courier New",monospace';if(!S.lines){const lines=[];let ln='';for(const w of S.txt.split(' ')){const tt=ln?ln+' '+w:w;if(c.measureText('* '+tt).width>760&&ln){lines.push(ln);ln=w}else ln=tt}lines.push(ln);S.lines=lines}
const bh=S.lines.length*28+36,bx=60,by=H-bh-16;c.fillStyle='#000';c.fillRect(bx,by,W-120,bh);c.strokeStyle='#fff';c.lineWidth=4;c.strokeRect(bx,by,W-120,bh);
c.fillStyle='#ff6a5a';c.font='700 15px "Courier New",monospace';c.textAlign='left';c.fillText(S.name||'TOMURA SHIGARAKI',bx+4,by-6);
c.fillStyle='#fff';c.font='700 22px "Courier New",monospace';let left=S.n;S.lines.forEach((l,i)=>{c.fillText((i?'  ':'* ')+l.slice(0,Math.max(0,left)),bx+18,by+34+i*28);left-=l.length+1})}
const hasOver=G.zs.some(z=>z.id==='overlord');if(hasOver){const g=c.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H);g.addColorStop(0,'rgba(80,0,20,0)');g.addColorStop(1,'rgba(80,0,20,.35)');c.fillStyle=g;c.fillRect(0,0,W,H)}}

function Icon({kind,id,size,locked,evo}){const ref=useRef();size=size||56;
useEffect(()=>{const cv=ref.current;if(!cv)return;const dpr=2;cv.width=size*dpr;cv.height=size*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,size,size);c.translate(size/2,size/2);
if(kind==='z'){const T=ZM[id];const sc=size/(T.r*2+16);c.scale(sc,sc);drawZombie(c,{x:0,y:0,ang:-.5,T,uid:1,spd:0,hp:1,max:0,shield:0,flash:0,dash:0,slowT:0,enr:false,invis:false},0)}
else{const T=TM[id];const sc=size/52;c.scale(sc,sc);drawTower(c,{x:0,y:2,T,id,lvl:1,evo:!!evo,ang:-.7,recoil:0,swing:0,firing:0,laser:0,hurt:0,spin:0,stun:0,hp:1,maxHp:1},0)}},[kind,id,size,evo]);
return html`<canvas ref=${ref} style=${{width:size+'px',height:size+'px',filter:locked?'brightness(0) opacity(.55)':'none'}}></canvas>`}

function Modal({title,onClose,children,narrow}){useEffect(()=>{const k=e=>{if(e.key==='Escape')onClose()};window.addEventListener('keydown',k);return()=>window.removeEventListener('keydown',k)},[]);
return html`<div className="back" onPointerDown=${e=>{if(e.target===e.currentTarget)onClose()}}><div className=${'modal'+(narrow?' narrow':'')} role="dialog" aria-label=${title}><div className="mh"><h2 className="disp">${title}</h2><button className="btn sm" onClick=${()=>{sfx('click');onClose()}}>Close</button></div><div className="mb">${children}</div></div></div>`}

function Bestiary({save,initial,onClose}){const [sel,setSel]=useState(initial||null);useEffect(()=>{A.dark=true;return()=>{A.dark=false}},[]);const seen=new Set(save.seen);const z=sel?ZM[sel]:null;
return html`<${Modal} title=${'Bestiary  '+seen.size+' / '+ZOMBIES.length} onClose=${onClose}>
<div className="split"><div className="grid">${ZOMBIES.map(Z=>{const k=seen.has(Z.id);return html`<button key=${Z.id} className=${'card'+(sel===Z.id?' sel':'')} onClick=${()=>{sfx('click');setSel(Z.id)}}><${Icon} kind="z" id=${Z.id} size=${64} locked=${!k}/><span className="nm">${k?Z.name:'???'}</span></button>`})}</div>
<div className="detail">${!z?html`<p className="hint">Select a zombie. Survive long enough to meet each one and its file unlocks.</p>`:!seen.has(z.id)?html`<h3 className="disp">Unknown creature</h3><p className="lore">Not encountered yet. First appears around wave ${z.minWave}.</p>`:html`<div style=${{display:'flex',gap:12,alignItems:'center'}}><${Icon} kind="z" id=${z.id} size=${84}/><div><h3 className="disp">${z.name}</h3><div className="small">${z.boss?'Boss':'Zombie'}</div></div></div>
<div className="kv"><span>Health</span><b>${z.hp}</b><span>Speed</span><b>${z.spd}</b><span>Base damage</span><b>${z.bd}</b><span>First seen</span><b>Wave ${z.minWave}</b><span>Power</span><b>${z.power}</b></div><p className="lore">${z.lore}</p>`}</div></div><//>`}

function TowerTree({T,evoOwned}){const rows=[['Level 1',1,false,'-'],['Level 2',2,false,'$'+upCost(T,1)],['Level 3',3,false,'$'+upCost(T,2)],['Evolved',3,true,'5 parts']];
return html`<div className="scroll-x"><table className="t"><thead><tr><th>Tier</th><th>Damage</th><th>Range</th><th>Fire rate</th><th>Cost</th></tr></thead><tbody>${rows.map(r=>{const S=statsFor(T,r[1],r[2]);return html`<tr key=${r[0]}><td>${r[0]}</td><td>${fmt(S.dmg)}${T.mult>1&&T.id==='shotgunner'?' x5':''}</td><td>${Math.round(S.range)}</td><td>${fmt(S.rate)}s</td><td>${r[3]}</td></tr>`})}</tbody></table></div>`}

function Index({onClose}){const [tab,setTab]=useState('t');const [sel,setSel]=useState('gunman');const [zs,setZs]=useState('walker');const T=TM[sel],Z=ZM[zs];

${tab==='t'?html`<div className="split"><div className="grid">${TOWERS.map(t=>html`<button key=${t.id} className=${'card'+(sel===t.id?' sel':'')} onClick=${()=>{sfx('click');setSel(t.id)}}><${Icon} kind="t" id=${t.id} size=${60}/><span className="nm">${t.name}</span><span className="rar" style=${{color:RAR[t.rar].c}}>${RAR[t.rar].n}</span></button>`)}</div>
<div className="detail"><div style=${{display:'flex',gap:12,alignItems:'center'}}><${Icon} kind="t" id=${T.id} size=${80}/><div><h3 className="disp">${T.name}</h3><div className="rar" style=${{color:RAR[T.rar].c}}>${RAR[T.rar].n} - ${T.type}</div></div></div>
<div className="kv"><span>Cost</span><b>$${T.cost}</b><span>Damage</span><b>${T.dmg}${T.id==='shotgunner'?' x5 pellets':T.id==='flame'?' / tick':''}</b><span>Range</span><b>${T.range}</b><span>Fire rate</span><b>${T.rate}s</b><span>Type</span><b>${T.type}</b></div>
<p className="lore" style=${{fontStyle:'normal'}}>${T.desc}</p><b>Upgrade tree</b><${TowerTree} T=${T}/><p className="small">Evolving at the Work Bench is permanent: +50% damage, +12% range, 20% faster fire, +25% tower health.</p></div></div>`
:html`<div className="split"><div className="grid">${ZOMBIES.map(z=>html`<button key=${z.id} className=${'card'+(zs===z.id?' sel':'')} onClick=${()=>{sfx('click');setZs(z.id)}}><${Icon} kind="z" id=${z.id} size=${60}/><span className="nm">${z.name}</span></button>`)}</div>
<div className="detail"><div style=${{display:'flex',gap:12,alignItems:'center'}}><${Icon} kind="z" id=${Z.id} size=${80}/><div><h3 className="disp">${Z.name}</h3><div className="small">${Z.boss?'Boss':'Zombie'}</div></div></div>
<div className="kv"><span>Health</span><b>${Z.hp}</b><span>Speed</span><b>${Z.spd}</b><span>Base damage</span><b>${Z.bd}</b><span>First wave</span><b>${Z.minWave}</b><span>Kill reward</span><b>$${Math.round((4+Math.sqrt(Z.hp)*.9)*(Z.boss?2:1))}</b><span>Power</span><b>${Z.power}</b></div><p className="small">Base damage is the HP it drains from your 100 HP base if it reaches the end.</p></div></div>`}<//>`}

function rollTower(){let tot=0;for(const k in RAR)tot+=RAR[k].w;let r=Math.random()*tot,rar='common';for(const k in RAR){r-=RAR[k].w;if(r<=0){rar=k;break}}return pick(TOWERS.filter(t=>t.rar===rar))}

function Chest({save,upd,onClose}){const [ph,setPh]=useState('idle');const [strip,setStrip]=useState([]);const [res,setRes]=useState(null);const [off,setOff]=useState(0);const box=useRef();const timers=useRef([]);const IW=104,WI=38;
useEffect(()=>()=>timers.current.forEach(clearTimeout),[]);
const open=()=>{if(ph==='spin')return;ac();startMusic();sfx('chestopen');const win=rollTower();const items=[];for(let i=0;i<44;i++)items.push(pick(TOWERS).id);items[WI]=win.id;setStrip(items);setRes({win,dup:save.owned.includes(win.id)});setPh('spin');setOff(0);
timers.current.push(setTimeout(()=>{const w=box.current?box.current.clientWidth:600;setOff(-(WI*IW+IW/2-w/2+rnd(-IW*.33,IW*.33)))},80));
const N=28;for(let i=1;i<=N;i++){timers.current.push(setTimeout(()=>sfx('tick'),4300*(1-Math.pow(1-i/N,.55))))}
timers.current.push(setTimeout(()=>{setPh('done');sfx('chime');upd(s=>s.owned.includes(win.id)?{...s,parts:s.parts+1}:{...s,owned:[...s.owned,win.id]})},4600))};
const chest=html`<svg width="120" height="96" viewBox="0 0 120 96" className=${ph!=='idle'?'open':''}><rect x="10" y="44" width="100" height="44" rx="4" fill="#6a4a2a" stroke="#2a1a0a" strokeWidth="3"/><rect x="10" y="58" width="100" height="6" fill="#3a2812"/><rect x="52" y="52" width="16" height="18" rx="2" fill="#e3b24a" stroke="#6a4a0a" strokeWidth="2"/><g className="lid"><path d="M10 44 Q10 14 60 14 Q110 14 110 44 Z" fill="#7a5632" stroke="#2a1a0a" strokeWidth="3"/><rect x="10" y="38" width="100" height="6" fill="#3a2812"/></g>${ph!=='idle'?html`<ellipse cx="60" cy="46" rx="40" ry="6" fill="#ffd96a" opacity=".6" className="glow"/>`:null}</svg>`;
return html`<${Modal} title="Free Chest" onClose=${onClose} narrow=${false}>
<div className="chestbox">${chest}<p className="hint" style=${{textAlign:'center',margin:0}}>No cost, no limit. Each roll can be anything from a Gunman to a Super Human. Duplicates become 1 Zombie Part.</p></div>
${ph!=='idle'?html`<div className="strip-wrap" ref=${box}><div className="mark"></div><div className="strip" style=${{transform:'translateX('+off+'px)',transition:off?'transform 4.4s cubic-bezier(.12,.62,.08,1)':'none'}}>${strip.map((id,i)=>html`<div key=${i} className="strip-item" style=${{borderBottom:'4px solid '+RAR[TM[id].rar].c}}><${Icon} kind="t" id=${id} size=${58}/><span>${TM[id].name}</span></div>`)}</div></div>`:null}
${ph==='done'&&res?html`<div className="pop" style=${{textAlign:'center',padding:'6px 0'}}><div className="rar" style=${{color:RAR[res.win.rar].c,fontSize:'1.1rem'}}>${RAR[res.win.rar].n}</div><h3 className="disp" style=${{fontSize:'2.6rem',margin:'0 0 4px',textShadow:'0 0 24px '+RAR[res.win.rar].c}}>${res.win.name}</h3><p className="hint" style=${{margin:0}}>${res.dup?'Already in your arsenal. Converted into 1 Zombie Part.':'Added to your arsenal. You can place it in any run.'}</p></div>`:null}

function Game({mode,save,upd,onExit,musicOn,toggleMusic,engRef}){
const cv=useRef(null),eng=useRef(null),saveRef=useRef(save);saveRef.current=save;
const [ui,setUi]=useState(null);const [bes,setBes]=useState(null);
useEffect(()=>{const G=newGame(mode,saveRef.current);eng.current=G;
G.hooks.seen=id=>upd(s=>s.seen.includes(id)?s:{...s,seen:[...s.seen,id]});
G.hooks.part=()=>upd(s=>({...s,parts:s.parts+1}));
G.hooks.end=(m,w,win)=>upd(s=>{const b={...s.best};if(m==='wave')b.wave=Math.max(b.wave,win?20:Math.max(0,w-1));else b.endless=Math.max(b.endless,Math.max(0,w-1)+0);return{...s,best:b}});
const dpr=Math.min(2,window.devicePixelRatio||1);const bg=makeBG(dpr);engRef.current=G;
let raf,last=performance.now(),snapT=0;
const snap=()=>{const s=G.sel;setUi({money:Math.floor(G.money),hp:Math.max(0,Math.ceil(G.hp)),wave:G.wave,active:G.waveActive,speed:G.speed,paused:G.paused,over:G.over,kills:G.kills,partsRun:G.partsRun,notif:G.notif?G.notif.id:null,place:G.place,left:G.q.length+G.zs.length,sel:s?{id:s.id,lvl:s.lvl,evo:s.evo,hp:Math.ceil(s.hp),max:s.maxHp,spent:s.spent,stun:s.stun>0,acd:Math.ceil(s.acd||0),awake:Math.ceil(s.awake||0),...statsFor(s.T,s.lvl,s.evo)}:null})};
const frame=now=>{const rdt=Math.min(.05,(now-last)/1000);last=now;if(!G.paused&&!G.hold&&!G.over){for(let i=0;i<G.speed;i++)step(G,rdt)}
const cc=cv.current;if(cc){if(cc.width!==W*dpr){cc.width=W*dpr;cc.height=H*dpr}const ctx=cc.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);draw(ctx,G,bg)}snapT+=rdt;if(snapT>.08){snapT=0;snap()}raf=requestAnimationFrame(frame)};
raf=requestAnimationFrame(frame);snap();
const key=e=>{if(e.key==='Escape'){G.place=null;G.sel=null;G.free=false;G.moving=null}};window.addEventListener('keydown',key);
return()=>{cancelAnimationFrame(raf);window.removeEventListener('keydown',key);engRef.current=null;A.boss=false}},[]);
useEffect(()=>{if(eng.current)eng.current.hold=!!bes},[bes]);
const G=()=>eng.current;
const toXY=e=>{const r=cv.current.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
const onMove=e=>{const g=G();if(!g)return;const p=toXY(e);g.mouse.x=p.x;g.mouse.y=p.y;g.mouse.in=true};
const onDown=e=>{const g=G();if(!g||g.over)return;ac();startMusic();const p=toXY(e);g.mouse.x=p.x;g.mouse.y=p.y;g.mouse.in=true;
if(g.place){g.moving=null;placeTower(g,g.place,Math.floor(p.x/GRID)*GRID+20,Math.floor(p.y/GRID)*GRID+20);return}
if(g.moving){const mx=Math.floor(p.x/GRID)*GRID+20,my=Math.floor(p.y/GRID)*GRID+20;const mt=g.moving;if(validSpot(g,mx,my,mt)){burst(g,mt.x,mt.y,10,'#8a7a5a',80,.4,3);mt.x=mx;mt.y=my;g.moving=null;sfx('place');burst(g,mx,my,10,'#e3b24a',80,.4,3);fx(g,{k:'ring',x:mx,y:my,r0:4,r1:26,col:'#e3b24a',w:2,life:.3})}else sfx('err');return}
let hit=null,bd=24;for(const t of g.ts){const d=hyp(t.x-p.x,t.y-p.y);if(d<bd){bd=d;hit=t}}if(hit&&hit===g.sel)awaken(g,hit);g.sel=hit;if(hit)sfx('click')};
const owned=TOWERS.filter(t=>save.owned.includes(t.id));
if(!ui)return html`<div className="game"><canvas ref=${cv} style=${{width:1,height:1}}></canvas></div>`;
const g=G();const sel=ui.sel;
return html`<div className="game">
<div className="hud"><div className="grp"><span className="lab">Base</span><div className="hpbar"><div className="hpfill" style=${{width:ui.hp+'%'}}></div><div className="hptxt">${ui.hp} / 100</div></div></div>
<div className="grp"><span className="lab">Cash</span><span style=${{color:'#e3b24a'}}>$${ui.money}</span></div>
<div className="grp"><span className="lab">Parts</span><span style=${{color:'#9ae06a'}}>${save.parts}</span>${ui.partsRun?html`<span className="small">(+${ui.partsRun})</span>`:null}</div>

<div className="stage"><canvas ref=${cv} onPointerMove=${onMove} onPointerDown=${onDown} onPointerLeave=${()=>{if(g)g.mouse.in=false}} onContextMenu=${e=>{e.preventDefault();g.place=null;g.moving=null}}></canvas>
${ui.notif?html`<button className="notif" onClick=${()=>{sfx('click');setBes(ui.notif);g.notif=null}}><${Icon} kind="z" id=${ui.notif} size=${44}/><span><b className="disp">NEW ZOMBIE UNLOCKED!</b><span className="small" style=${{color:'#ffd'}}>${ZM[ui.notif].name} - tap to open the Bestiary</span></span></button>`:null}
${ui.paused&&!ui.over?html`<div className="overlay"><h2 className="disp">Paused</h2><button className="btn primary" onClick=${()=>{g.paused=false}}>Resume</button></div>`:null}
${ui.over?html`<div className="overlay"><h2 className="disp" style=${{color:ui.over.win?'#8fc15a':'#c8352b'}}>${ui.over.win?'Siege survived':'Base overrun'}</h2><p style=${{margin:0,fontSize:'1.2rem'}}>${ui.over.win?'THE OVERLORD is dead. The road is quiet.':mode==='endless'?'You held until wave '+Math.max(0,ui.over.wave-1)+' cleared.':'You fell on wave '+ui.over.wave+' of 20.'} Kills: ${ui.kills}. Zombie Parts found: ${ui.partsRun}.</p><div style=${{display:'flex',gap:8}}><button className="btn primary" onClick=${()=>{sfx('click');onExit(true)}}>Play again</button><button className="btn" onClick=${()=>{sfx('click');onExit()}}>Back to lobby</button></div></div>`:null}</div>
<div className="dock"><div style=${{display:'flex',flexDirection:'column',gap:6}}><button className="btn primary big wavebtn" style=${{textAlign:'center',fontSize:'1.35rem',flex:1}} disabled=${ui.active||!!ui.over} onClick=${()=>{ac();startMusic();startWave(g)}}>${ui.active?'Wave '+ui.wave+' running':'Start wave '+(ui.wave+1)}</button></div>
<div className="shop" role="list">${owned.map(T=>{const can=ui.money>=T.cost;return html`<button key=${T.id} role="listitem" className=${'shopi'+(ui.place===T.id?' on':'')+(can?'':' no')} title=${T.desc} onClick=${()=>{sfx('click');g.place=g.place===T.id?null:T.id;g.sel=null;g.free=false}}><${Icon} kind="t" id=${T.id} size=${44} evo=${save.evo.includes(T.id)}/><span>${T.name}</span><span className="c">$${T.cost}</span></button>`})}</div>
<div className="tpanel">${sel?html`<div style=${{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}><b className="disp" style=${{fontSize:'1.5rem'}}>${TM[sel.id].name}${sel.evo?' \u2605':''}</b><span className="small">Level ${sel.lvl}/3${sel.stun?' - STUNNED':''}</span></div>

<div className="row"><button className="btn sm primary" disabled=${sel.lvl>=3||ui.money<upCost(TM[sel.id],sel.lvl)} onClick=${()=>upgradeTower(g,g.sel)}>${sel.lvl>=3?'Max level':'Upgrade $'+upCost(TM[sel.id],sel.lvl)}</button><button className="btn sm" onClick=${()=>sellTower(g,g.sel)}>Sell +$${Math.floor(sel.spent*.7)}</button>${sel.id==='superhuman'&&sel.lvl>=3?html`<button className="btn sm" onClick=${()=>{sfx('click');g.moving=g.sel;g.place=null;if(g.sel)ftext(g,g.sel.x,g.sel.y-30,'Click a free spot','#ffe08a',1)}}>Move</button>`:null}${(sel.id==='rin'||sel.id==='isagi')&&sel.lvl>=3?html`<button className="btn sm primary" disabled=${sel.acd>0||sel.awake>0} onClick=${()=>awaken(g,g.sel)}>${(sel.id==='rin'?"I'll Mangle You":'Metavision')+(sel.awake>0?' ACTIVE '+sel.awake+'s':sel.acd>0?' '+sel.acd+'s':'')}</button>`:null}<button className="btn sm" onClick=${()=>{g.sel=null}}>Deselect</button></div>`:html`<span className="small">${ui.place?'Click a free grid spot to build '+TM[ui.place].name+'. Right-click or Esc to cancel.':'Pick a tower below to build, or tap a placed tower to upgrade or sell it. Range circles show where it can hit.'}</span>`}</div></div>
${bes!==null?html`<${Bestiary} save=${save} initial=${bes} onClose=${()=>setBes(null)}/>`:null}</div>`}

function AdminPanel({save,upd,engRef,onClose}){
const g=engRef.current;
const [tab,setTab]=useState(g?'units':'prog');const [zid,setZid]=useState('walker');const [cnt,setCnt]=useState(5);const [tid,setTid]=useState('gunman');const [wv,setWv]=useState(1);const [msg,setMsg]=useState('');
useEffect(()=>{if(g)g.hold=true;return()=>{if(g)g.hold=false}},[]);
const say=m=>{sfx('click');setMsg(m)};
const spawn=()=>{const n=clamp(cnt|0,1,100);for(let i=0;i<n;i++)spawnZ(g,zid,g.hm,g.sm,i*16);say('Spawned '+n+'x '+ZM[zid].name)};
const placeFree=()=>{g.place=tid;g.free=true;g.sel=null;onClose()};
const tb=(k,l)=>html`<button className=${'tab'+(tab===k?' on':'')} onClick=${()=>{sfx('click');setTab(k)}}>${l}</button>`;
return html`<${Modal} title="Admin Panel" onClose=${onClose}>
<div className="tabs">${g?tb('units','Spawn zombies'):null}${g?tb('towers','Add tower'):null}${g?tb('cheats','Game cheats'):null}${tb('prog','Progress')}</div>
${msg?html`<p className="hint" style=${{color:'#9ae06a'}}>${msg}</p>`:null}
${tab==='units'&&g?html`<div className="grid">${ZOMBIES.map(z=>html`<button key=${z.id} className=${'card'+(zid===z.id?' sel':'')} onClick=${()=>{sfx('click');setZid(z.id)}}><${Icon} kind="z" id=${z.id} size=${56}/><span className="nm">${z.name}</span></button>`)}</div>
<div style=${{display:'flex',gap:8,alignItems:'center',marginTop:12}}><span className="small">Count</span><input type="number" min="1" max="100" value=${cnt} onChange=${e=>setCnt(+e.target.value)} className="btn sm" style=${{width:80}}/><button className="btn primary" onClick=${spawn}>Spawn ${ZM[zid].name}</button></div>`:null}
${tab==='towers'&&g?html`<div className="grid">${TOWERS.map(t=>html`<button key=${t.id} className=${'card'+(tid===t.id?' sel':'')} onClick=${()=>{sfx('click');setTid(t.id)}}><${Icon} kind="t" id=${t.id} size=${56}/><span className="nm">${t.name}</span></button>`)}</div>
<div style=${{marginTop:12}}><button className="btn primary" onClick=${placeFree}>Place ${TM[tid].name} for free (click on map)</button></div>`:null}
${tab==='cheats'&&g?html`<div style=${{display:'flex',gap:8,flexWrap:'wrap'}}>
<button className="btn" onClick=${()=>{g.money+=1000;say('+$1000')}}>+$1000</button>
<button className="btn" onClick=${()=>{g.money+=10000;say('+$10000')}}>+$10000</button>
<button className="btn" onClick=${()=>{g.hp=100;say('Base healed')}}>Heal base</button>
<button className="btn" onClick=${()=>{for(const z of g.zs.slice())killZ(g,z);say('All zombies killed')}}>Kill all zombies</button></div>
<div style=${{display:'flex',gap:8,alignItems:'center',marginTop:12}}><span className="small">Next wave number</span><input type="number" min="1" max="99" value=${wv} onChange=${e=>setWv(+e.target.value)} className="btn sm" style=${{width:80}}/><button className="btn" onClick=${()=>{if(g.waveActive){say('Wait until the current wave ends');return}g.wave=clamp(wv|0,1,99)-1;say('Next wave: '+(g.wave+1))}}>Set wave</button></div>`:null}
${tab==='prog'?html`<div style=${{display:'flex',gap:8,flexWrap:'wrap'}}>
<button className="btn" onClick=${()=>{upd(s=>({...s,owned:TOWERS.map(t=>t.id)}));say('All towers unlocked')}}>Unlock all towers</button>
<button className="btn" onClick=${()=>{upd(s=>({...s,parts:s.parts+10}));say('+10 Zombie Parts')}}>+10 Zombie Parts</button>
<button className="btn" onClick=${()=>{upd(s=>({...s,seen:ZOMBIES.map(z=>z.id)}));say('Bestiary completed')}}>Discover all zombies</button>
<button className="btn" onClick=${()=>{upd(s=>({...s,evo:TOWERS.map(t=>t.id)}));say('All towers evolved (applies from next run)')}}>Evolve all towers</button></div>
<p className="small" style=${{marginTop:12}}>Towers: ${save.owned.length}/${TOWERS.length} | Parts: ${save.parts}</p>`:null}<//>`}

function App(){
const [save,setSave]=useState(loadSave);const [screen,setScreen]=useState('lobby');const [modal,setModal]=useState(null);const [mode,setMode]=useState('wave');const [musicOn,setMusicOn]=useState(save.music!==false);const [runId,setRunId]=useState(0);
const upd=useCallback(fn=>setSave(s=>{const n=fn(s);if(n!==s)persist(n);return n}),[]);
useEffect(()=>{A.on=musicOn;const f=()=>{ac();if(A.on)startMusic()};window.addEventListener('pointerdown',f,{once:true});return()=>window.removeEventListener('pointerdown',f)},[]);
const toggleMusic=()=>{ac();const n=!musicOn;setMusicOn(n);setMusic(n);upd(s=>({...s,music:n}));sfx('click')};
const resetAll=()=>{const n={owned:['gunman'],evo:[],parts:0,seen:[],best:{wave:0,endless:0},music:musicOn};setSave(n);persist(n)};
const close=()=>setModal(null);
const engRef=useRef(null);
const adminBtn=html`<button className="btn sm adminbtn" onClick=${()=>{ac();sfx('click');setModal('admin')}}>Admin Panel</button>`;
const adminModal=modal==='admin'?html`<${AdminPanel} save=${save} upd=${upd} engRef=${engRef} onClose=${close}/>`:null;
if(screen==='game')return html`<${React.Fragment}>${adminBtn}<${Game} key=${runId} engRef=${engRef} mode=${mode} save=${save} upd=${upd} musicOn=${musicOn} toggleMusic=${toggleMusic} onExit=${again=>{if(again)setRunId(r=>r+1);else setScreen('lobby')}}/>${adminModal}<//>`;
return html`<${React.Fragment}>${adminBtn}<${Lobby} save=${save} upd=${upd} setModal=${setModal} musicOn=${musicOn} toggleMusic=${toggleMusic} resetAll=${resetAll}/>
${modal==='mode'?html`<${ModeSelect} save=${save} onClose=${close} onPick=${m=>{setMode(m);setModal(null);setRunId(r=>r+1);setScreen('game')}}/>`:null}
${modal==='chest'?html`<${Chest} save=${save} upd=${upd} onClose=${close}/>`:null}
${modal==='bench'?html`<${Bench} save=${save} upd=${upd} onClose=${close}/>`:null}
${modal==='bestiary'?html`<${Bestiary} save=${save} onClose=${close}/>`:null}
${modal==='index'?html`<${Index} onClose=${close}/>`:null}${modal==='info'?html`<${InfoTab} onClose=${close}/>`:null}${adminModal}<//>`}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
